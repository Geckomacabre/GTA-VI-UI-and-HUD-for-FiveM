<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            background-color: transparent !important;
        }
        /* Anchored to the minimap instead of floating at the screen edge.
           `2vw` put this ~320px away from the map on an ultrawide, because the
           map is positioned against a centred 16:9 safe zone while this was
           positioned against the raw viewport.

           .stage reproduces vice_hud's stage EXACTLY: the full viewport, not a
           centred 16:9 box. vice_hud's own style.css spells out why — anchoring
           to a centred 16:9 box displaces every element on ultrawide, because
           the reference (and GTA's native minimap) anchor to the physical
           screen edges instead. A letterboxed stage here used to mean 1cqw was
           a different physical distance on this page than on vice_hud's, so an
           offset landed in the wrong place the moment the aspect ratio changed.
           Keep these numbers in step with Config.Minimap in vice_hud/config.lua. */
        .stage {
            position: fixed;
            inset: 0;
            width: 100vw;
            pointer-events: none;
            container-type: size;
        }
        #speedlimit {
            display: none;
            /* --off-* is pushed from vice_hud's HUD editor (/movehud) so this
               sign can be repositioned alongside the rest of the HUD, even
               though it lives in a different resource with its own NUI page. */
            transform: translate(var(--off-x, 0cqw), var(--off-y, 0cqh)) scale(var(--sc, 1));
            transform-origin: bottom left;
            position: absolute;
            /* Sits just above the minimap's top-left corner.
               Minimap: left 1.82%, top edge at 80.6% (bottom 19.4%). */
            left: 1.75cqw;
            bottom: 18.4cqh;
        }
        #speedlimit > img {
            width: 4.1cqw;
            max-width: none;
            display: block;
        }
    </style>
    <title>919 NUI Speedlimit</title>
</head>
<body>
    <div class="stage"><div id="speedlimit"></div></div>
    <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
    <script>
        var IsOpen = false;
        $(document).ready(function() {
            window.addEventListener('message', function(event) {
                // Accept either key: this page has always read `action`, while
                // the offset push used to send `type`.
                switch (event.data.action || event.data.type) {
                    case "show":
                        $("#speedlimit").show();
                        IsOpen = true;
                        break;
                    case "hide":
                        $("#speedlimit").hide();
                        IsOpen = false;
                        break;
                    case "offset":
                        {
                            const st = document.querySelector('.stage');
                            if (st) {
                                st.style.setProperty('--off-x', (event.data.x || 0) + 'cqw');
                                st.style.setProperty('--off-y', (event.data.y || 0) + 'cqh');
                                st.style.setProperty('--sc', event.data.s == null ? 1 : event.data.s);
                            }
                        }
                        break;
                    case "setlimit":
                        $("#speedlimit").html('<img src="img/' + event.data.speed + '.png"/>');
                        break;
                }
            });
        });
    </script>
</body>
</html>
