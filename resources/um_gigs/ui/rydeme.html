  :root {
    --accent: #ff3ea3;
    --on-accent: #1a0a14;
    --accent-text: #ff3ea3;
    --bg: #0c0710;
    --ink: #f4e9f2;
    --font-body: 'GTAArtDeco', 'Inter', system-ui, -apple-system, sans-serif;
  }

  /* The app owns the full phone screen: a flex column with one scrolling view
     in the middle and the tab bar pinned to the bottom. Without this the
     content just stacked from the top and stopped, leaving the tab bar
     floating mid-screen over a large dead black area -- the single biggest
     reason this did not read as a real app. */
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #board, #profile, #ride { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  #tabbar { flex: 0 0 auto; }

  /* lb-phone draws its own status bar and dynamic island over the top of the
     app iframe. Anything inside this band is invisible, so both screens start
     below it rather than guessing a smaller number and clipping again. */
  :root { --notch: 78px; --navbar: 26px; }

  /* The wordmark: white "ryde", pink "me", always centred, always Optien.
     Used both in the board header and the profile hero -- one rule, one look. */
  .word {
    font-family: 'Optien', system-ui, sans-serif;
    text-align: center;
    letter-spacing: -0.5px;
    /* Barely-there glow -- a hint of light behind the wordmark, not a neon
       sign. Kept small and low-opacity on purpose; text-shadow layers behind
       the glyphs so it still works on .rtip's gradient-clipped fill below. */
    text-shadow: 0 0 10px rgba(255, 62, 163, 0.30);
  }
  .word .w1 { color: var(--ink); }
  .word .w2 { color: var(--accent); }

  /* The r's tip is pink -- part of the letterform itself, not a glow behind
     it. Painted by clipping a hard-stop gradient to the glyph: white above
     the cut, accent below it.

     --r-tip-cut is a share of the INLINE BOX, not of the visible letter, and
     the two are very different. Measured in Optien: the lowercase r's ink
     only spans 34.5% to 72.4% of that box, the rest being ascender and
     descender space it never touches. So the whole useful range is
     34.5-72.4, and anything at or past 72.4% paints a sliver too thin to
     see (which is exactly how the first attempt at this vanished).

       65%  = bottom fifth of the r  (current)
       63%  = bottom quarter
       67%  = a thinner lip
       72%+ = invisible, do not go here

     Keep in step with the matching hard stop in rydeme.svg. */
  .word .rtip {
    --r-tip-cut: 65%;
    background-image: linear-gradient(
      to bottom,
      var(--ink) var(--r-tip-cut),
      var(--accent) var(--r-tip-cut)
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* The confetti dots from the icon/reference art, brought into the app itself.
     Positioned in the side margins (10-18% and 82-92% from each edge) rather
     than tiled across the whole area -- the wordmark is horizontally centred
     and narrower than its container, so those margins are reliably clear on
     any screen this class gets used on. The icon version of this same idea
     put dots at fixed pixel coordinates on a fixed 120x120 canvas, which is
     exactly what made them collide with the letterforms once the icon was
     shown bigger than that canvas: fixed pixels do not track where the text
     actually ends up. Percentage-of-container margins do.

     Each dot drifts and fades on its own timer (see the d1-d6 rules below) --
     six different durations and delays so they never fall into a visible
     lock-step, which is what would have read as one blinking thing instead of
     six calm ones. */
  .confetti { position: relative; overflow: hidden; }
  .confetti .dot {
    position: absolute;
    border-radius: 50%;
    background: var(--accent);
    pointer-events: none;
    animation-name: confetti-float;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  .confetti .d1 { left: 11%; top: 20%; width: 6px; height: 6px; opacity: 0.85; animation-duration: 3.8s; animation-delay: 0s; }
  .confetti .d2 { left: 17%; top: 58%; width: 4px; height: 4px; opacity: 0.6;  animation-duration: 4.6s; animation-delay: 0.9s; }
  .confetti .d3 { left: 7%;  top: 82%; width: 8px; height: 8px; opacity: 0.5;  animation-duration: 5.2s; animation-delay: 1.7s; }
  .confetti .d4 { right: 13%; top: 16%; width: 5px; height: 5px; opacity: 0.7; animation-duration: 4.1s; animation-delay: 0.4s; }
  .confetti .d5 { right: 8%;  top: 52%; width: 7px; height: 7px; opacity: 0.55; animation-duration: 4.9s; animation-delay: 1.3s; }
  .confetti .d6 { right: 17%; top: 80%; width: 4px; height: 4px; opacity: 0.8; animation-duration: 4.3s; animation-delay: 2.1s; }
  @keyframes confetti-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); opacity: 0.35; }
  }
  @media (prefers-reduced-motion: reduce) {
    .confetti .dot { animation: none; }
  }

  /* Board header: dark, not a solid-pink block. A pink "me" needs a
     background it can actually be seen against. */
  header {
    background: var(--bg);
    color: var(--ink);
    text-align: center;
    padding: var(--notch) 16px 16px;
    border-bottom: 2px solid var(--accent);
  }
  header .word { font-size: 34px; }
  #tagline { opacity: 0.6; margin-top: 6px; }
  #rating { justify-content: center; }

  #warn { text-align: left; }

  /* ---- Driver Profile ------------------------------------------------- */
  #profile { display: none; }
  /* The pink bar runs to the very top of the screen (it sits behind the
     phone's status bar, which is what the reference shows), but its CONTENT
     starts below the notch band so the avatar and title are never covered. */
  .profile-label {
    background: var(--accent); color: var(--on-accent);
    padding: var(--notch) 16px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  /* The corner avatar: tap to change it, camera or camera roll. Sized to
     actually read as a face (44px), not the placeholder dot the reference
     screenshot's own OS chrome draws in that corner -- this one has to work,
     so it needs to be big enough to tap and to show what got picked. */
  .profile-label .avatar-btn {
    all: unset; box-sizing: border-box; cursor: pointer;
    flex-shrink: 0; position: relative;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(0,0,0,0.25);
    border: 1.5px solid rgba(255,255,255,0.35);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .profile-label .avatar-btn img {
    display: none;
    width: 100%; height: 100%; object-fit: cover;
  }
  .profile-label .avatar-btn.has-photo img { display: block; }
  .profile-label .avatar-btn.has-photo .avatar-placeholder { display: none; }
  .profile-label .avatar-cam {
    position: absolute; right: -2px; bottom: -2px;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); color: var(--on-accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; line-height: 1;
    border: 1.5px solid var(--accent);
    box-shadow: 0 0 0 2px var(--bg);
  }
  .profile-label .title {
    flex: 1; text-align: center;
    font-size: 17px; font-weight: 700;
    margin-right: 44px; /* balances the avatar so the title is truly centred */
  }
  .hero-brand { padding: 34px 16px 26px; text-align: center; }
  .hero-brand .word { font-size: 64px; }

  /* ---- Avatar picker sheet ----------------------------------------------
     Two ways in, same as the phone's own camera app offers: shoot one now,
     or pull one already on the roll. A bottom sheet rather than a native
     <select> because nothing here is a native anything -- this whole app is
     one NUI page, and a sheet matches everything else in it. */
  #avatar-sheet {
    display: none;
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    background: rgba(0,0,0,0.55);
    z-index: 60;
    align-items: flex-end;
    justify-content: center;
  }
  #avatar-sheet.on { display: flex; }
  #avatar-sheet .sheet {
    width: 100%;
    background: var(--bg);
    border-top: 2px solid var(--accent);
    border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(16px + var(--navbar));
  }
  #avatar-sheet .sheet-title {
    text-align: center; font-size: 13px; font-weight: 600;
    opacity: 0.7; margin-bottom: 14px;
  }
  #avatar-sheet button.opt {
    all: unset; box-sizing: border-box; cursor: pointer;
    display: block; width: 100%; text-align: center;
    padding: 13px 0; margin-top: 8px;
    font-family: var(--font-body); font-size: 14px; font-weight: 500;
    color: var(--ink);
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
  }
  #avatar-sheet button.opt.cancel {
    color: rgba(244,233,242,0.6);
    background: transparent; border-color: transparent;
    margin-top: 14px;
  }

  /* ---- Avatar camera: live game-view feed, same shell as #ride-map-overlay -- */
  #avatar-camera-overlay {
    display: none;
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    background: var(--bg);
    flex-direction: column;
    z-index: 61;
  }
  #avatar-camera-overlay.on { display: flex; }
  #avatar-camera-canvas {
    flex: 1 1 auto; min-height: 0;
    width: 100%; height: 100%;
    display: block;
    background: #10151c;
    object-fit: cover;
  }
  #avatar-camera-confirm {
    flex: 0 0 auto;
    padding: 14px 16px calc(14px + var(--navbar));
  }
  /* The "you tanked it" alert -- a much louder moment than the plain #warn
     banner on the board screen, because this is the one place a real app
     would actually show it: your own profile, not buried in the fare list. */
  .suspend-alert {
    margin: 0 16px 20px;
    border: 2px solid var(--accent);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
  }
  .suspend-alert .icon { font-size: 22px; color: var(--accent); line-height: 1; }
  .suspend-alert .title {
    margin-top: 6px;
    font-size: 14px; font-weight: 500; letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .suspend-alert .msg-pill {
    margin-top: 14px;
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 11.5px;
    line-height: 1.4;
    opacity: 0.9;
  }
  #profile-stats { text-align: center; padding: 0 16px 22px; }
  #profile-stats .num-big { font-size: 28px; font-weight: 500; }
  #profile-stats .stars { font-size: 15px; display: block; margin-top: 2px; }
  #profile-stats .sub { font-size: 11.5px; opacity: 0.65; margin-top: 6px; }
  #profile-history { padding: 0 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  #profile-history .card .row { align-items: center; }
  #profile-history .stars { font-size: 12px; }

  /* ---- Bottom tab bar --------------------------------------------------
     Two views, one bar, always on screen -- borrowed from the standard
     ride-share app layout rather than a corner button nobody notices. */
  /* The bar was sized like a plain footer (12px/14px padding) and read as
     squashed against the phone's own home-indicator bar at the bottom of the
     screen. --navbar adds real clearance there, the same idea as --notch at
     the top, so the tab labels sit clear of it instead of crowding it. */
  #tabbar {
    display: flex;
    border-top: 1px solid rgba(255,255,255,0.10);
    background: var(--bg);
    padding-bottom: var(--navbar);
  }
  #tabbar button {
    all: unset; box-sizing: border-box;
    flex: 1; text-align: center;
    padding: 16px 0 16px;
    font-family: var(--font-body);
    font-size: 12px; font-weight: 500;
    color: rgba(244,233,242,0.5);
    cursor: pointer;
    border-top: 2px solid transparent;
  }
  #tabbar button.on {
    color: var(--accent);
    border-top: 2px solid var(--accent);
  }

  /* ---- Incoming request card --------------------------------------------
     What app.js's incomingHtml()/tickClock() actually render on the Rides
     screen the moment a dispatch lands. None of this had a rule anywhere,
     so the card was rendering as unstyled stacked divs. */
  .request {
    margin: 12px; padding: 14px;
    background: rgba(255,255,255,0.055);
    border: 1.5px solid var(--accent);
    border-radius: 13px;
  }
  .req-top { display: flex; justify-content: space-between; align-items: baseline; }
  .req-kind {
    font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--accent);
  }
  .req-secs { font-size: 13px; font-weight: 700; }
  .req-clock {
    margin-top: 8px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.12); overflow: hidden;
  }
  .req-clock i {
    display: block; height: 100%; background: var(--accent);
    transition: width 0.25s linear;
  }
  .req-pay { margin-top: 10px; font-size: 24px; font-weight: 800; color: var(--accent-text, var(--accent)); }
  .req-who { margin-top: 4px; font-size: 13px; }
  .req-actions { display: flex; gap: 8px; margin-top: 12px; }
  .req-actions button { margin-top: 0; }
  .req-actions .ghost { background: rgba(255,255,255,0.09); color: var(--ink); }
  .req-hint { margin-top: 8px; font-size: 10.5px; opacity: 0.55; text-align: center; }

  /* ---- Dispatch idle: "you are offline" / "looking for riders" ---------- */
  .empty.waiting { padding-top: 24px; }
  .pulse {
    width: 14px; height: 14px; margin: 0 auto 14px;
    border-radius: 50%; background: var(--accent);
    animation: rydeme-pulse 1.4s ease-in-out infinite;
  }
  @keyframes rydeme-pulse {
    0%, 100% { transform: scale(0.85); opacity: 0.7; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  /* ---- Rider mode: the "Ride" tab, when you are the passenger -----------
     #ride never had the top-notch clearance header/.profile-label both get,
     which is what made it look broken rather than merely plain: its first
     line of text rendered partly behind the phone's own status bar. Padding
     lives on #ride itself (not on .ride-head) because .ride-head is only one
     of three different screens app.js renders in here -- the active-ride and
     rating screens need the same clearance and have no .ride-head of their
     own to put it on. */
  #ride { display: none; padding-top: var(--notch); }
  .ride-head {
    padding: 4px 16px 16px;
    text-align: center;
    border-bottom: 2px solid var(--accent);
    position: relative; overflow: hidden;
  }
  .ride-q { font-size: 20px; font-weight: 700; }
  .ride-sub { margin-top: 4px; font-size: 12px; opacity: 0.65; }

  /* Real driver vs NPC, as the two entry points into the map picker rather
     than a tier toggle sitting above a whole list of curated stops -- one
     tap picks both the tier AND takes you straight to naming a destination,
     the same two taps a real rideshare app asks for. */
  .ride-picks { padding: 18px 16px 4px; display: flex; flex-direction: column; gap: 12px; }
  .ride-pick {
    all: unset; box-sizing: border-box; cursor: pointer;
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 15px 16px;
    background: rgba(255,255,255,0.055);
    border: 1.5px solid rgba(255,255,255,0.14);
    border-radius: 16px;
    font-family: var(--font-body);
  }
  .ride-pick:active { transform: translateY(1px); }
  .ride-pick-icon {
    flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 21px;
    background: rgba(255,255,255,0.08);
  }
  .ride-pick.npc .ride-pick-icon { background: rgba(255,45,149,0.16); }
  .ride-pick-body { flex: 1; min-width: 0; }
  .ride-pick-title { display: block; font-size: 15px; font-weight: 700; color: var(--ink); }
  .ride-pick-sub { display: block; font-size: 11px; opacity: 0.65; margin-top: 2px; color: var(--ink); }
  .ride-pick-tag {
    flex-shrink: 0; font-size: 9.5px; font-weight: 800; letter-spacing: 0.5px;
    padding: 4px 9px; border-radius: 20px;
    background: rgba(255,255,255,0.09); color: var(--ink);
  }
  .ride-pick.npc .ride-pick-tag { background: rgba(255,45,149,0.18); color: var(--accent-text, var(--accent)); }

  .dest-fare { font-size: 15px; font-weight: 800; color: var(--accent-text, var(--accent)); }
  .ride-foot { padding: 10px 16px 18px; font-size: 10.5px; opacity: 0.55; text-align: center; }
  .ride-err {
    margin: 10px 12px 0; padding: 9px 11px;
    background: rgba(255,77,77,0.14);
    border: 1px solid rgba(255,77,77,0.35);
    border-radius: 9px;
    font-size: 11.5px;
  }

  /* The one button in this app that is a joke: every ride screen with a
     driver attached to it gets a "Report driver" link that files nothing
     and reports to no one -- see showReportToast() in app.js. */
  .report-link {
    all: unset; box-sizing: border-box; cursor: pointer;
    display: block; width: 100%; text-align: center;
    padding: 9px 0; margin-top: 2px;
    font-family: var(--font-body); font-size: 11px; font-weight: 500;
    color: rgba(244,233,242,0.4);
  }
  .report-link:active { color: rgba(244,233,242,0.75); }
  #toast {
    position: fixed; left: 50%; bottom: calc(84px + var(--navbar));
    transform: translate(-50%, 10px);
    max-width: 82%;
    background: rgba(18,10,16,0.95);
    border: 1px solid rgba(255,45,149,0.35);
    color: var(--ink);
    font-family: var(--font-body); font-size: 12px; font-weight: 500; line-height: 1.4;
    padding: 11px 16px; border-radius: 13px;
    text-align: center;
    z-index: 80;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---- Waypoint destination: full-screen map preview --------------------
     A sibling of #board/#profile/#ride, not a child of #ride -- app.js
     rewrites #ride's entire innerHTML on every poll while this tab is open,
     which would tear down a live Leaflet instance sitting inside it. Living
     outside that subtree means the map survives being polled past. */
  #ride-map-overlay {
    display: none;
    /* top/right/bottom/left rather than the `inset` shorthand -- not every
       CEF build FiveM ships supports it, and there is no upside to risking
       the one property that would make this whole overlay fail to size. */
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    background: var(--bg);
    flex-direction: column;
    z-index: 50;
  }
  #ride-map-overlay.on { display: flex; }
  .map-topbar {
    background: var(--accent); color: var(--on-accent);
    padding: var(--notch) 16px 14px;
    display: flex; align-items: center; gap: 10px;
    flex: 0 0 auto;
  }
  .map-topbar button { all: unset; cursor: pointer; font-size: 20px; line-height: 1; padding: 2px 8px; }
  .map-topbar .title { flex: 1; text-align: center; font-size: 13px; font-weight: 500; margin-right: 28px; }
  /* Deliberately NOT the same colour as the app's own --bg: the satellite
     tile is a large image fetched over nui://, and while it is still loading
     (or if it fails) this area needs to read as "a map, still loading" --
     not be indistinguishable from the rest of the dark app and look like
     nothing rendered at all. */
  #ride-map {
    flex: 1 1 auto; min-height: 0;
    background: #10151c;
  }
  .leaflet-container { background: #10151c; }
  /* leaflet.css's .leaflet-div-icon default is a white box with a grey
     border, meant to be overridden per-icon -- pinIcon() (app.js) never
     did, so every pin rendered as a plain white square around the SVG. */
  .ride-pin { background: none; border: 0; }
  .leaflet-control-attribution { display: none !important; }
  /* makeBaseMap() (app.js) stamps these on whichever container it was given
     -- #ride-map, #drive-map, or #npc-map -- so the rule has to match all
     three, not just the first one this was written for. */
  #ride-map.loading::after,
  #drive-map.loading::after,
  #npc-map.loading::after {
    content: 'Loading map…';
    display: block;
    padding-top: 40%;
    text-align: center;
    font-size: 12px;
    color: rgba(244,233,242,0.45);
  }
  #ride-map.map-error::after,
  #drive-map.map-error::after,
  #npc-map.map-error::after {
    content: 'Map image unavailable';
    display: block;
    padding-top: 40%;
    text-align: center;
    font-size: 12px;
    color: rgba(255,45,149,0.7);
  }
  #ride-map-confirm {
    flex: 0 0 auto;
    padding: 14px 16px calc(14px + var(--navbar));
    text-align: center;
  }
  .map-quote {
    display: flex; justify-content: center; align-items: baseline; gap: 16px;
    margin-bottom: 12px; font-size: 13px;
  }
  .map-quote .dest-fare { font-size: 22px; }

  /* ---- Rating screen: the one review a person actually writes ----------- */
  .rate { padding: 22px 16px; }
  .star-row { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
  .star-row .star {
    all: unset; cursor: pointer;
    font-size: 30px; line-height: 1;
    color: rgba(244,233,242,0.3);
  }
  .star-row .star.on { color: var(--accent); }
  #rate-note {
    display: block; width: 100%; margin-top: 16px; padding: 10px;
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 9px;
    font-family: var(--font-body); color: var(--ink); font-size: 13px;
    resize: none; min-height: 60px;
  }

  /* ---- Profile history chips: real rider / never arrived / tier --------- */
  .chips { margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.3px;
    padding: 2px 7px; border-radius: 20px;
    background: rgba(255,255,255,0.09); color: var(--ink);
  }
  .chip.bad { background: rgba(255,77,77,0.18); color: #ff9a9a; }

  /* ---- Drive HUD: the "phone mounted on the dash" view -------------------
     Shown on the Board tab while a Ryde Me job is active. Built once per job
     (see shownJobKey in app.js) and patched live every second after that --
     see tickDrive(). */
  #drive-hud { margin: 14px 16px 0; text-align: left; }
  #drive-map {
    height: 170px; border-radius: 13px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.10);
  }
  #drive-meter {
    display: flex; align-items: center; gap: 12px;
    margin-top: 10px;
  }
  #drive-speed {
    font-family: var(--font-body);
    font-size: 30px; font-weight: 800; color: var(--ink);
    line-height: 1;
  }
  #drive-speed .unit { font-size: 11px; font-weight: 500; opacity: 0.6; margin-left: 3px; }
  /* The circular red-ringed sign is deliberately the real-world speed-limit
     shape -- it is the one piece of this HUD that should read as instantly
     familiar rather than as an app invention. */
  #drive-limit-badge {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    background: #f4f4f2; border: 3px solid #d6293f;
    display: flex; align-items: center; justify-content: center;
    color: #16151a; font-weight: 800; font-size: 15px;
    font-family: var(--font-body);
  }
  #drive-hud.over #drive-speed { color: var(--accent); }

  /* ---- NPC ride: the rider-side live map + Speed Up / End Fare -----------
     The map IS the screen here, not a thumbnail sitting above a lot of
     empty space -- .ride-live pulls up over #ride's own top padding (the
     phone's fake status bar clearance) so #npc-map can go truly edge to
     edge, with the status line and action buttons floating on top of it as
     translucent cards, the way a real rideshare app's live map works. */
  .ride-live {
    position: relative;
    margin-top: calc(-1 * var(--notch));
    height: calc(100% + var(--notch));
    overflow: hidden;
  }
  #npc-map {
    position: absolute; inset: 0;
    margin: 0; border-radius: 0; border: 0;
    background: #10151c;
  }
  .ride-live-status {
    position: absolute; left: 16px; right: 16px;
    top: calc(var(--notch) + 6px);
    z-index: 2;
    background: rgba(12,7,16,0.72);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 12px 14px;
    text-align: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .ride-live-actions {
    position: absolute; left: 16px; right: 16px;
    bottom: calc(var(--navbar) + 14px);
    z-index: 2;
  }
  .npc-actions { display: flex; gap: 8px; }
  .npc-actions button { margin-top: 0; }
  .npc-actions #npc-speedup { background: rgba(255,255,255,0.09); color: var(--ink); }
  .npc-actions #npc-speedup:disabled { opacity: 0.6; }
  /* Floating over the map rather than the plain app background here, so it
     needs its own legibility rather than relying on --bg behind it. */
  .ride-live-actions .report-link {
    margin-top: 8px;
    background: rgba(12,7,16,0.6);
    border-radius: 11px;
    color: rgba(244,233,242,0.75);
  }
  .ride-live-actions .report-link:active { color: var(--ink); }

  /* The freak-out. A funny line, a shake, and a way to make it stop -- see
     the Silence button, which mutes it for the rest of THIS job only. */
  #drive-alert { display: none; }
  #drive-alert.on {
    display: block;
    margin-top: 10px; padding: 12px 14px;
    border: 2px solid var(--accent);
    border-radius: 13px;
    background: rgba(255,45,149,0.14);
    text-align: center;
    animation: rydeme-freakout 0.35s ease-in-out infinite;
  }
  #drive-alert .msg { font-weight: 700; font-size: 13px; text-transform: lowercase; }
  #drive-alert .mute {
    all: unset; box-sizing: border-box; cursor: pointer;
    display: inline-block; margin-top: 9px;
    padding: 6px 16px; border-radius: 20px;
    background: rgba(255,255,255,0.14); color: var(--ink);
    font-family: var(--font-body); font-size: 11px; font-weight: 500;
  }
  @keyframes rydeme-freakout {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    25% { transform: translateX(-3px) rotate(-0.6deg); }
    75% { transform: translateX(3px) rotate(0.6deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    #drive-alert.on { animation: none; }
  }
</style>
</head>
<body>
  <div id="board">
    <header class="confetti">
      <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
      <span class="dot d4"></span><span class="dot d5"></span><span class="dot d6"></span>
      <div class="word"><span class="w1"><span class="rtip">r</span>yde</span><span class="w2">me</span></div>
      <div id="tagline">Rides from strangers, priced dynamically.</div>
      <div id="rating"></div>
    </header>

    <div id="warn"></div>
    <div id="list"></div>
    <div id="actions">
      <button id="duty">Go online</button>
      <button id="refresh">Refresh</button>
    </div>
  </div>

  <div id="profile">
    <div class="profile-label">
      <button id="avatar-btn" class="avatar-btn" type="button" aria-label="Change profile photo">
        <img id="avatar-img" alt="" />
        <span class="avatar-placeholder">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        </span>
        <span class="avatar-cam">
          <svg viewBox="0 0 24 24" width="10" height="10" fill="currentColor"><path d="M4 7h3l2-2h6l2 2h3v13H4z"/><circle cx="12" cy="13" r="3.5" fill="var(--bg)"/></svg>
        </span>
      </button>
      <span class="title">Driver Profile</span>
    </div>
    <div class="hero-brand confetti">
      <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
      <span class="dot d4"></span><span class="dot d5"></span><span class="dot d6"></span>
      <div class="word"><span class="w1"><span class="rtip">r</span>yde</span><span class="w2">me</span></div>
    </div>
    <div id="profile-alert"></div>
    <div id="profile-stats"></div>
    <div id="profile-history"></div>
  </div>

  <div id="ride"></div>

  <!-- Sits outside #board/#profile/#ride for the same reason
       #ride-map-overlay does: app.js rewrites those on every poll, which
       would cut a fade-out short mid-animation. See showReportToast(). -->
  <div id="toast"></div>

  <div id="avatar-sheet">
    <div class="sheet">
      <div class="sheet-title">Profile photo</div>
      <button type="button" class="opt" id="avatar-take">Take photo</button>
      <button type="button" class="opt" id="avatar-roll">Choose from camera roll</button>
      <button type="button" class="opt cancel" id="avatar-cancel">Cancel</button>
    </div>
  </div>

  <!-- The phone's own live game-view camera, via globalThis.components.
       createGameRender() paints into this canvas; a sibling of #board/etc for
       the same reason #ride-map-overlay is one -- app.js must not tear this
       subtree down mid-shot. -->
  <div id="avatar-camera-overlay">
    <div class="map-topbar">
      <button id="avatar-camera-back" aria-label="Back">‹</button>
      <span class="title">Take photo</span>
    </div>
    <canvas id="avatar-camera-canvas"></canvas>
    <div id="avatar-camera-confirm">
      <button type="button" class="opt" id="avatar-camera-shoot">Capture</button>
    </div>
  </div>

  <div id="ride-map-overlay">
    <div class="map-topbar">
      <button id="map-back" aria-label="Back">‹</button>
      <span class="title">Confirm destination</span>
    </div>
    <div id="ride-map"></div>
    <div id="ride-map-confirm"></div>
  </div>

  <nav id="tabbar">
    <button class="tab on" data-tab="board">Rides</button>
    <button class="tab" data-tab="ride">Ride</button>
    <button class="tab" data-tab="profile">Profile</button>
  </nav>

<script>
  window.GIG_APP  = 'rydeme';
  window.GIG_COPY = { name: 'rydeme', tagline: 'Rides from strangers, priced dynamically.', lowRating: 'Due to unsatisfactory ratings, people can no longer Ryde you.', dutyOff: 'Go online', dutyOn: 'Online · tap to stop', accept: 'Accept ride' };

  // lb-phone renders custom apps in an iframe and posts 'componentsLoaded' when
  // it is ready. Staying hidden until then stops the page flashing up as a
  // full-screen NUI before the phone has framed it -- same pattern lonelymans
  // uses, and the reason app.js is attached here rather than in <head>.
  //
  // The message is the preferred start, not the only one. body is hidden by CSS
  // and app.js is what fetches the offers, so if componentsLoaded never lands --
  // or landed before this listener existed -- the app is a permanently blank
  // screen that never asks the server for anything. The timeout is the floor.
  var booted = false;

  function boot() {
    if (booted) return;
    booted = true;
    document.body.style.visibility = 'visible';
    var s = document.createElement('script');
    s.src = 'app.js';
    document.body.appendChild(s);
  }

  window.addEventListener('message', function (e) {
    if (e.data === 'componentsLoaded') boot();
  });

  setTimeout(boot, 1500);
</script>
</body>
</html>
